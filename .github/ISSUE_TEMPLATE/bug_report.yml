name: Bug report
description: Something in Adaptive Arsenal is wrong, broken or crashed the game.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. The more of this you fill in, the faster it can be fixed.
        One bug per report, please. Check the [open issues](https://github.com/Deaadman/adaptive-arsenal/issues) first, in case it's already there.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and any error you saw.
      placeholder: A wolf I shot with the rifle at close range didn't take any damage.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The wolf is hit and runs off bleeding, like it does without the mod.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from loading a save, and how often it happens. A short video helps.
      placeholder: |
        1. Load a save with a rifle and ammo
        2. Find a wolf and let it charge
        3. Shoot it from the hip when it's a few metres away

  - type: dropdown
    id: where
    attributes:
      label: Which part of the mod
      multiple: true
      options:
        - Shooting, accuracy or damage
        - Bullet trails
        - The ammo animation on the HUD
        - Moving while aiming the revolver
        - The game crashed or wouldn't load
        - Something else
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Adaptive Arsenal version
      description: The console window that opens with the game shows it when the mod loads, like 1.1.0 or 1.1.0-nightly.20261022+g1a2b3c4.
      placeholder: 1.1.0
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: The Long Dark version
      description: Shown at the bottom of the game's main menu.
      placeholder: "2.55"
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Your other mods
      description: Everything in your game's Mods folder. If you can, check whether it still happens with only Adaptive Arsenal and its dependencies.

  - type: textarea
    id: log
    attributes:
      label: MelonLoader log
      description: |
        Close the game, then drag `MelonLoader\Latest.log` from your game's folder into this box. Please attach the file rather than a screenshot of the console.
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a video, or anything else that might help.
