name: Feature request
description: An idea for something Adaptive Arsenal could do, or do better.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [open issues](https://github.com/Deaadman/adaptive-arsenal/issues) first, in case someone has already suggested it.

  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The moment in the game where the weapons fall short. Start from your game, not the feature.
      placeholder: When I fire the rifle at a wolf in a blizzard, nothing about the cold changes how the shot goes.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What the mod could do about it.
      placeholder: A rifle that's been out in the cold for hours could jam more often until it's warmed up by a fire.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the mod
      multiple: true
      options:
        - Shooting, accuracy or damage
        - Bullets and trails
        - The HUD
        - Movement and aiming
        - A weapon or tool the mod doesn't touch yet
        - Something new
