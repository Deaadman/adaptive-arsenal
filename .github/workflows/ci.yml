# Checks every push to main and every pull request: the changelog's format,
# formatting, then a Release build with warnings as errors. Restoring checks
# every NuGet package for security advisories, and packages.lock.json must
# match the project. The nightly and release workflows run this first and only
# publish when it passes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    name: Changelog and format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Changelog
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Check
      - name: Restore
        run: dotnet restore src --locked-mode
      # Fails if any file differs from what .editorconfig asks for.
      - name: Format
        run: dotnet format whitespace src/AdaptiveArsenal.csproj --verify-no-changes

  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Locked mode fails if packages.lock.json is out of date; the audit fails on an advisory.
      - name: Restore
        run: dotnet restore src --locked-mode
      - name: Build
        run: dotnet build src -c Release --no-restore
      - name: Report the version and size
        shell: pwsh
        run: |
          $kb = (Get-Item src/bin/Release/net6.0/AdaptiveArsenal.dll).Length / 1KB
          "AdaptiveArsenal.dll **$(Get-Content src/obj/Version.txt)**: {0:N0} KB" -f $kb >> $env:GITHUB_STEP_SUMMARY
