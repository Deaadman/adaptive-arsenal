# Publishes a release: push a tag like 1.1.0 (no v prefix) that matches the
# VersionPrefix in src/AdaptiveArsenal.csproj. The release carries
# AdaptiveArsenal.dll, which the README's download link and the mod's
# MelonInfo point at. The version's section of CHANGELOG.md is the release's
# description; the release stops if it has none.
#
# It also publishes the AdaptiveArsenal NuGet package, which other mods use to
# fire its projectiles, to nuget.org and to the repository's GitHub Packages.
# nuget.org trusts this workflow through a trusted publishing policy, so
# there's no API key to keep: see docs/development.md, "The NuGet package".
#
# A manual run checks but never publishes: the job below only publishes from
# a tag.

name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# Read-only by default; only the job that publishes can write.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Nothing ships unless CI passes.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # Only from a tag: a manual run from a branch checks but never publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
      # For GitHub Packages.
      packages: write
      # For nuget.org's trusted publishing, which logs in with the workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet restore src --locked-mode
          dotnet build src -c Release --no-restore

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (Get-Content src/obj/Version.txt -Raw).Trim()
          if ($version -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the version in src/AdaptiveArsenal.csproj, $version"
          }

      - name: Read the release notes from CHANGELOG.md
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version $env:GITHUB_REF_NAME -OutDir notes

      - name: Pack
        run: dotnet pack src -c Release --no-build -o packages

      # The packages go first, so a run that fails after them can be rerun: --skip-duplicate passes over a version
      # that's already there, while the GitHub release can only be created once.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Deadman

      - name: Publish to nuget.org
        run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push "packages/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ github.token }}" --skip-duplicate

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The changelog section first, then GitHub's generated notes (merged PRs and the full changelog link).
        run: gh release create $env:GITHUB_REF_NAME src/bin/Release/net6.0/AdaptiveArsenal.dll --title $env:GITHUB_REF_NAME --notes-file notes/release-notes.md --generate-notes --verify-tag
