# Once a week, opens a pull request against develop for NuGet packages and
# actions with a newer version. Minor and patch updates come together in one
# pull request per ecosystem; a new major version gets its own, since it may
# break the code. CI runs on each one, so merge it when it passes.
#
# A new Il2CppAssemblies version usually means a game update: check the mod
# in-game before releasing with it.

version: 2

updates:
  - package-ecosystem: nuget
    directories: [/src, /tests/AdaptiveArsenal.Tests]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      packages:
        update-types: [minor, patch]
    ignore:
      # Only referenced to leave its files out: ModData depends on it. See src/AdaptiveArsenal.csproj.
      - dependency-name: ds5678.Modding.TLD.Il2CppAssemblies.Windows
      # The same, for ModSettings.
      - dependency-name: STBlade.Modding.TLD.Il2CppAssemblies.Windows
      # Pinned below what the game's assemblies ask for: 0.7.3's package fails the build. See src/AdaptiveArsenal.csproj.
      - dependency-name: LavaGang.MelonLoader

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
